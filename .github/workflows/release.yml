name: NEXORA Frontend Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build web --release
      - run: cd build/web && zip -r ../../nexora-web-${{ github.ref_name }}.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: nexora-web-${{ github.ref_name }}.zip
          generate_release_notes: true
